// small key-value store (IndexedDB, falls back to localStorage)
const kv = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('ts-db', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const hasIDB = typeof indexedDB !== 'undefined';
  return {
    get: k => !hasIDB ? Promise.resolve(JSON.parse(localStorage.getItem('kv_' + k) || 'null'))
      : open().then(db => new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); })),
    set: (k, v) => !hasIDB ? Promise.resolve(localStorage.setItem('kv_' + k, JSON.stringify(v)))
      : open().then(db => new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }))
  };
})();
const norm = s => String(s || '').trim().toUpperCase();
const DB = {
  lines:     () => [...new Set(EMP.map(e => e.line))].sort(),
  employees: line => EMP.filter(e => norm(e.line) === norm(line)),
  styles:    () => Object.keys(OPS).sort(),
  findStyle: v => Object.keys(OPS).find(k => norm(k) === norm(v)) || '',
  ops:       style => (OPS[style] || []).slice().sort((a, b) => a.no - b.no)   // {no, code, sam, machine}
};
const mkOpMap = style => { const m = {}; DB.ops(style).forEach(o => m[o.no] = { sam:o.sam, machine:o.machine }); return m; };

          sup:{ eff:55, bal:70, period:'30', line:'', ie:'', type:'' } };
let H = [];                                        // my saved studies
let TEAM = [], REV = {}, DIRH = null, PEOPLE = [], CHOOSER_CB = null;   // studies of other IEs, supervisor reviews, folder handle, email list
let screen = 'home', detailId = null, detailBack = 'history', active = -1, live = null;
let opMap = {}, pick = { emp:'', ops:[] };         // pick = operator being prepared
function saveDraft() { try { localStorage.setItem('ts_draft', JSON.stringify(S)); } catch(e){} }
function saveHist()  { try { localStorage.setItem('ts_hist', JSON.stringify(H)); } catch(e){} }
const save = saveDraft;
try {
  Object.assign(S, JSON.parse(localStorage.getItem('ts_draft') || '{}'));
  S.sup = Object.assign({ eff:55, bal:70, period:'30', line:'', ie:'', type:'' }, S.sup || {});
  H = JSON.parse(localStorage.getItem('ts_hist') || '[]');
  const old = JSON.parse(localStorage.getItem('ts') || 'null');            // migrate version 0.2 data
  if (old) { H = (old.history || []).map(x => ({ ...x, id:String(x.id) })); delete old.history;
             Object.assign(S, old); localStorage.removeItem('ts'); saveDraft(); saveHist(); }
} catch(e){}
S.rows.forEach(r => r.t0 = null);
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Date.now() + Math.random().toString(36).slice(2));
const t = k => (T[S.lang][k] !== undefined ? T[S.lang][k] : k);
const tf = (k, o) => Object.keys(o || {}).reduce((s, x) => s.split('{' + x + '}').join(o[x]), t(k));
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f = (n, d=1) => Number(n).toFixed(d);
const P = (v, d=1) => (Number(v) * 100).toFixed(d) + '%';
const fmtDate = iso => new Date(iso).toLocaleString(S.lang === 'vi' ? 'vi-VN' : 'en-GB');
const fmtDay = iso => new Date(iso).toLocaleDateString(S.lang === 'vi' ? 'vi-VN' : 'en-GB');
const isSup = () => !!(S.supMode || (S.me && S.me.role === 'supervisor'));
const findStudy = id => H.find(x => x.id === id) || TEAM.find(x => x.id === id);
function go(s, id, from) {
  if (s === 'detail') detailBack = from || (screen === 'sup' ? 'sup' : 'history');
  screen = s; detailId = id ?? null; render();
}
function goBack() { go(screen === 'detail' ? detailBack : 'home'); }

// =====================================================================
// NEW STUDY SCREEN  (built once; only the parts that change are redrawn)
// =====================================================================
function viewNewSkeleton() {
  const lines = DB.lines().map(l => `<option value="${esc(l)}">`).join('');
  const styles = DB.styles().map(x => `<option value="${esc(x)}">`).join('');

  const types = ['routine', 'new', 'before', 'after'].map(k => `<option value="${k}" ${S.type === k ? 'selected' : ''}>${t('ty_' + k)}</option>`).join('');
  return banner + `<div class="card">
      <div class="row"><div><label>${t('line')}</label>
        <input id="line" list="lineList" value="${esc(S.line)}" oninput="onLine(this.value)" autocomplete="off">
        <datalist id="lineList">${lines}</datalist></div>
      <div><label>${t('style')}</label><input id="style" list="styleList" value="${esc(S.style)}" oninput="onStyle(this.value)" autocomplete="off">
        <datalist id="styleList">${styles}</datalist></div></div>
      <div class="warn" id="styleWarn"></div>
      <div class="row"><div><label>${t('ie')}</label><input id="ie" value="${esc(S.ie)}" oninput="S.ie=this.value;save();updateAnalysis()"></div>
      <div><label>${t('target')}</label><input id="target" type="number" value="${esc(S.target)}" oninput="S.target=this.value;save();updateAnalysis()"></div></div>
      <div class="row"><div><label>${t('studyType')}</label><select id="type" onchange="S.type=this.value;save()">${types}</select></div>
      <div><label>${t('manpower')}</label><input id="manpower" type="number" min="0" value="${esc(S.manpower)}" oninput="S.manpower=this.value;save()"></div></div>
      <label>${t('cycles')}</label><input id="cycles" type="number" min="1" max="20" value="${esc(S.cycles || 5)}" oninput="S.cycles=this.value;save();updateCards()">
      <textarea id="note" rows="2" placeholder="${t('note')}" oninput="S.note=this.value;save()">${esc(S.note)}</textarea>
    </div>
    <div class="card">
      <select id="empSel" onchange="pick.emp=this.value;refreshAdd()"></select>
      <div class="muted" id="empCount"></div>
      <div class="chips" id="chips"></div>
      <div class="info" id="opInfo"></div>
      <button id="addBtn" onclick="addOp()">${t('add')}</button>
    </div>
    <div id="cards"></div>
    <div id="quality"></div>
    <div id="analysis"></div>
    <div class="savebar"><div class="muted" id="saveStatus"></div>
      <button id="saveBtn" onclick="saveStudy()">${t('save')}</button></div>`;
}
function buildNew() {
  $('app').innerHTML = viewNewSkeleton();
  opMap = mkOpMap(S.style);
  active = S.rows.findIndex(r => r.t0 !== null);
  $('styleWarn').textContent = (S.style && !DB.findStyle(S.style)) ? t('styleMissing') : '';
  buildEmp(); buildOps(); refreshAdd(); updateCards(); updateAnalysis();
}
function onLine(v) { S.line = v; save(); buildEmp(); }
function onStyle(v) {
  const found = DB.findStyle(v);
  S.style = found; save(); opMap = mkOpMap(found); pick.ops = [];
  $('styleWarn').textContent = (!found && v.trim()) ? t('styleMissing') : '';
  buildOps(); refreshAdd(); updateCards(); updateAnalysis();
}
function buildEmp() {                       // employee dropdown = employees of the typed line
  const list = DB.employees(S.line);
  $('empSel').innerHTML = `<option value="">${list.length ? t('selEmp') : t('noEmp')}</option>`
    + list.map(e => `<option value="${esc(e.code)}">${esc(e.code)} – ${esc(e.name)}${S.rows.some(r => r.emp === e.code) ? ' ✓' : ''}</option>`).join('');
  $('empCount').textContent = list.length ? `${list.length} ${t('empCount')}` : '';
  pick.emp = ''; refreshAdd();
}
function buildOps() {                       // operation chips of the selected style
  const box = $('chips'), sc = box.scrollTop;
  box.innerHTML = DB.ops(S.style).map(o =>
    `<button class="chip ${pick.ops.includes(o.no) ? 'on' : ''}" onclick="toggleOp(${o.no})">${o.no}</button>`).join('');
  box.scrollTop = sc;
}
function toggleOp(no) {
  pick.ops = pick.ops.includes(no) ? pick.ops.filter(x => x !== no) : [...pick.ops, no];
  buildOps(); refreshAdd();
}
function opDetails(ops) {                   // SAM + machine required for chosen operations
  const sel = ops.slice().sort((a, b) => a - b), rows = DB.ops(S.style).filter(o => sel.includes(o.no));
  const total = rows.reduce((s, o) => s + o.sam, 0);
  const machines = [...new Set(rows.map(o => o.machine).filter(Boolean))];
  return { rows, total, machines };
}
function refreshAdd() {
  const d = opDetails(pick.ops);
  $('opInfo').innerHTML = d.rows.length
    ? d.rows.map(o => `<div>${t('opn')} <b>${o.no}</b>${o.code ? ' · ' + esc(o.code) : ''} · ${t('sam')} ${f(o.sam, 4)} · ${t('machine')}: <b>${esc(o.machine || '-')}</b></div>`).join('')
      + (d.rows.length > 1 ? `<div>${t('totalSam')}: <b>${f(d.total, 4)}</b> · ${t('machine')}: ${esc(d.machines.join(', ') || '-')}</div>` : '')
    : t('selOps');
  const ok = pick.emp && pick.ops.length;
  $('addBtn').disabled = !ok;
  $('addBtn').textContent = ok ? t('add') : t('addNeed');
}
function addOp() {
  if (!pick.emp || !pick.ops.length) return;
  const e = DB.employees(S.line).find(x => x.code === pick.emp);
  S.rows.push({ emp:e.code, name:e.name, opText:pick.ops.slice().sort((a, b) => a - b).join('+'), pieces:[], skip:[], remark:'', t0:null });
  pick = { emp:'', ops:[] };
  save(); buildEmp(); buildOps(); refreshAdd(); updateCards(); updateAnalysis();
}

// ---------- remarks ----------
const QUICK = ['chất lượng chưa ổn định', 'k đủ hàng làm', 'thao tác chậm, điều chỉnh lâu', 'nhảy công đoạn', 'Đi HT', 'mới học'];
function addRemark(i, txt) {                // tap a quick remark: it is added to the text
  const r = S.rows[i]; r.remark = r.remark ? r.remark.replace(/[;\s]+$/, '') + '; ' + txt : txt;
  save(); updateCards();
}

// ---------- stopwatch ----------
const MIN_CYCLE = 1.5;                        // seconds: a faster second tap is treated as an accidental double tap
const openCard = new Set();                   // finished cards the IE opened again
const cyclesGoal = () => Math.max(1, Number(S.cycles) || 5);
const nUsed = r => usedCycles(r).length;
function nextToTime(i) {                      // next operator that still needs cycles
  for (let k = 1; k <= S.rows.length; k++) { const j = (i + k) % S.rows.length; if (nUsed(S.rows[j]) < cyclesGoal()) return j; }
  return -1;
}
function tap(i, ev) {                         // Start, then every tap = one piece done
  const r = S.rows[i], now = ev ? ev.timeStamp : performance.now();
  let next = -1;
  if (r.t0 === null) {
    S.rows.forEach((x, k) => { if (k !== i) x.t0 = null; });                  // only one stopwatch runs at a time
    r.t0 = now; active = i;
  } else {
    const sec = (now - r.t0) / 1000;
    if (sec < MIN_CYCLE) return;
    r.pieces.push(sec); r.t0 = now;
    if (nUsed(r) >= cyclesGoal()) { r.t0 = null; active = -1; openCard.delete(i); next = nextToTime(i); }   // enough cycles: stop and move on
  }
  save(); updateCards(); updateAnalysis();
  if (next >= 0) { const el = $('card' + next); if (el && el.scrollIntoView) el.scrollIntoView({ behavior:'smooth', block:'center' }); }
}
function toggleCycle(i, k) {                  // exclude / include an abnormal cycle
  const r = S.rows[i]; r.skip = r.skip || [];
  r.skip = r.skip.includes(k) ? r.skip.filter(x => x !== k) : [...r.skip, k];
  save(); updateCards(); updateAnalysis();
}
function stop(i) { S.rows[i].t0 = null; active = -1; save(); updateCards(); }
function undo(i) { const r = S.rows[i]; r.pieces.pop(); r.skip = (r.skip || []).filter(k => k < r.pieces.length); r.t0 = null; save(); updateCards(); updateAnalysis(); }
function del(i) { S.rows.splice(i, 1); active = -1; openCard.clear(); save(); buildEmp(); updateCards(); updateAnalysis(); }

function updateCards() {
  const tg = cyclesGoal();
  $('cards').innerHTML = S.rows.map((r, i) => {
    const c = calcOperator(r, opMap), d = opDetails(c.ops), n = c.n, done = n >= tg && r.t0 === null;
    const stat = n ? `${t('avg')} <b>${f(c.sec)}</b> · ${f(c.capacity)} ${t('pcsHr')} · ${f(c.eff * 100)}% · ${t('cv')} ${f(c.cv * 100)}%` : '';
    const warnCv = n >= 3 && c.cv > 0.15 ? `<div class="warn">⚠ ${t('cvHigh')}</div>` : '';
    if (done && !openCard.has(i)) return `<div class="card done" id="card${i}"><b>${esc(r.name)}</b> <small class="muted">${esc(r.emp)}</small> &nbsp; ${t('opn')} <b>${esc(r.opText)}</b> <span class="ok">✓ ${n}/${tg}</span>
      <div class="muted">${stat}</div>${warnCv}${r.remark ? `<div class="muted">📝 ${esc(r.remark)}</div>` : ''}
      <button class="sec" onclick="openCard.add(${i});updateCards()">${t('open')}</button></div>`;
    return `<div class="card${done ? ' done' : ''}" id="card${i}"><b>${esc(r.name)}</b> <small class="muted">${esc(r.emp)}</small> &nbsp; ${t('opn')} <b>${esc(r.opText)}</b> <span class="${done ? 'ok' : 'muted'}">${n}/${tg}</span>
      <div class="muted">${t('sam')} ${f(c.sam, 4)} · ${t('machine')}: ${esc(d.machines.join(', ') || '-')}</div>
      <div class="time" id="tm${i}">${r.t0 === null ? '0.0' : ''}</div>
      <button class="big" onpointerdown="tap(${i},event)">${r.t0 === null ? t('start') : t('piece')}</button>
      ${r.pieces.length ? `<div class="cyc">${r.pieces.map((p, k) => `<button class="cy ${(r.skip || []).includes(k) ? 'off' : ''}" onclick="toggleCycle(${i},${k})">${f(p)}</button>`).join('')}</div><div class="muted" style="font-size:12px">${t('cyclesHint')}</div>` : ''}
      ${n ? `<div class="metrics"><div>${t('avg')}<b>${f(c.sec)}</b></div><div>${t('pcsHr')}<b>${f(c.capacity)}</b></div><div>${t('effp')}<b>${f(c.eff * 100)}%</b></div></div><div class="muted">${t('cv')}: ${f(c.cv * 100)}%</div>${warnCv}`
          : `<div class="muted">${t('firstHint')}</div>`}
      <textarea rows="2" placeholder="${t('remark')}" oninput="S.rows[${i}].remark=this.value;save()">${esc(r.remark || '')}</textarea>
      <div class="qr">${QUICK.map((q, k) => `<button class="sec" onclick="addRemark(${i},QUICK[${k}])">+ ${esc(q)}</button>`).join('')}</div>
      <div class="row"><button class="sec" onclick="stop(${i})">${t('stop')}</button>
      <button class="sec" onclick="undo(${i})">${t('undo')}</button>
      <button class="sec" onclick="del(${i})">${t('del')}</button>${done ? `<button class="sec" onclick="openCard.delete(${i});updateCards()">${t('close')}</button>` : ''}</div></div>`;
  }).join('');
  keepAwake(S.rows.some(r => r.t0 !== null));
}
function liveStudy() {                      // the study as it would be saved now
  return { raw: S.rows.filter(r => r.pieces.length).map(r => ({ emp:r.emp, name:r.name, opText:r.opText, pieces:r.pieces, skip:r.skip || [], remark:r.remark || '' })),
           result: live, target: S.target, opsSnap: [] };
}
function qualityHtml(q) {
  const txt = i => tf('qi_' + i.k, { n: i.n, v: i.v != null ? P(i.v, 0) : '' });
  return `<div class="card q-${q.status}"><b>${t('quality')}: ${t('q_' + q.status)}</b> <span class="muted">· ${f(q.avgCycles)} ${t('cycles').toLowerCase()}</span>${q.issues.map(i => `<div class="warn">⚠ ${esc(txt(i))}</div>`).join('')}</div>`;
}
function updateAnalysis() {                 // live: recomputed after every piece, no Analyze button
  const rows = S.rows.filter(r => r.pieces.length);
  if (!rows.length) { live = null; $('analysis').innerHTML = `<div class="card muted">${t('timeFirst')}</div>`; $('quality').innerHTML = ''; }
  else { live = analyze(rows, opMap); live.unknownOps = [];
         live.missingOps = DB.ops(S.style).map(o => o.no).filter(no => live.opCap[no] === undefined);
         $('quality').innerHTML = qualityHtml(AN.quality(liveStudy()));
         $('analysis').innerHTML = showResult(live, Number(S.target)); }
  const ready = live && S.ie.trim() && DB.findStyle(S.style);
  $('saveBtn').disabled = !ready;
  $('saveStatus').textContent = !live ? t('timeFirst') : !S.ie.trim() ? t('needIe') : !DB.findStyle(S.style) ? t('styleMissing')
    : `${rows.length} ${t('timed')} · ${f(live.lineCapacity)} ${t('pcsHr')} · ${f(live.lineEfficiency * 100)}%`;
}
function saveStudy() {
  updateAnalysis(); if (!live || !S.ie.trim()) return;
  const raw = S.rows.filter(r => r.pieces.length).map(r => ({ emp:r.emp, name:r.name, opText:r.opText, pieces:r.pieces, skip:r.skip || [], remark:r.remark || '' }));
  const rec = { line:S.line, style:S.style, target:S.target, ie:S.ie.trim(), type:S.type || 'routine', note:S.note || '', manpower:S.manpower || '', cyclesGoal:cyclesGoal(), raw,
                opsSnap:[...new Set(live.workers.flatMap(w => w.ops))].sort((a, b) => a - b).map(no => ({ no, sam:opMap[no] ? opMap[no].sam : 0, machine:opMap[no] ? opMap[no].machine : '' })),
                meta:{ app:APP_VER, defaultAllowance:DEFAULT_ALLOWANCE }, exported:false, result:JSON.parse(JSON.stringify(live)) };
  rec.quality = AN.quality(rec);
  const ex = S.editId && H.find(h => h.id === S.editId);
  let id;
  if (ex) { Object.assign(ex, rec, { updated:new Date().toISOString() }); id = ex.id; }      // update the same study
  else { id = uid(); H.unshift({ id, date:new Date().toISOString(), ...rec }); }
  S.rows = []; S.editId = null; S.type = 'routine'; S.note = ''; S.manpower = ''; live = null; saveHist(); saveDraft(); go('detail', id, 'history');
}
function editStudy(id) {                    // load a saved study back into the New Study screen
  const h = H.find(x => x.id === id); if (!h) return;
  if (S.rows.length && S.editId !== id && !confirm(t('replaceDraft'))) return;
  if (S.editId !== id) {
    S.rows = h.raw.map(r => ({ emp:r.emp, name:r.name, opText:r.opText, pieces:r.pieces.slice(), skip:(r.skip || []).slice(), remark:r.remark || '', t0:null }));
    S.line = h.line; S.style = h.style; S.target = h.target || ''; S.ie = h.ie || ''; S.type = h.type || 'routine'; S.note = h.note || ''; S.manpower = h.manpower || ''; S.editId = id;
  }
  save(); go('new');
}
function cancelEdit() { const id = S.editId; S.rows = []; S.editId = null; save(); go(id ? 'detail' : 'history', id, 'history'); }
function delStudy(id) { if (!confirm(t('sure'))) return; H = H.filter(h => h.id !== id); saveHist(); go('history'); }

// ---------- keep screen on while timing ----------
let lock = null;
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.onrelease = () => lock = null; }
    else if (!on && lock) { await lock.release(); lock = null; }
  } catch(e){}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(S.rows.some(r => r.t0 !== null)); });

// =====================================================================
// SCREENS: home, history, detail
// =====================================================================
function render() {
  const y = window.scrollY;
  $('lang').value = S.lang;
  $('back').style.display = screen === 'home' ? 'none' : '';
  $('app').className = screen === 'sup' ? 'wide' : '';
  $('title').textContent = screen === 'home' ? t('title') : screen === 'new' ? t('newStudy') : screen === 'history' ? t('history') : screen === 'sup' ? t('dash') : t('study');
  if (screen === 'new') return buildNew();
  $('app').innerHTML = screen === 'home' ? viewHome() : screen === 'history' ? viewHistory() : screen === 'sup' ? viewSup() : viewDetail();
  if (screen === 'sup' && y) window.scrollTo(0, y);
}
function viewHome() {
  const week = Date.now() - 7 * 86400000, mine = H.filter(h => new Date(h.date).getTime() >= week).length;
  const meLine = !PEOPLE.length ? t('noPeopleShort') : S.me
    ? `${t('user')}: <b>${esc(S.me.name)}</b> (${esc(S.me.email)}) · ${S.me.role === 'supervisor' ? t('roleSup') : t('roleOff')} <button class="sec small" onclick="openChooser()">${t('change')}</button>`
    : `<button onclick="openChooser()">${t('selectName')}</button>`;
  return `<button class="home" onclick="go('new')">+ ${t('newStudy')}</button>
          <button class="home sec" onclick="go('history')">${t('history')} (${H.length})</button>
          ${isSup() ? `<button class="home green" onclick="go('sup')">${t('dash')}</button>` : ''}
          <div class="muted">${t('myWeek')}: <b>${mine}</b></div>
          <input type="file" id="dataFile" accept=".json,.js,.txt,application/json" style="display:none" onchange="loadDataFile(this)">
          <button class="sec" onclick="$('dataFile').click()">${t('loadData')}</button>
          <input type="file" id="peopleFile" accept=".csv,.txt,.json,text/csv,application/json" style="display:none" onchange="loadPeopleFile(this)">
          <button class="sec" onclick="$('peopleFile').click()">${t('loadPeople')}</button>
          <div class="muted">${meLine}</div>
          <label class="muted"><input type="checkbox" style="width:auto;margin:6px 6px 0 0" ${S.supMode ? 'checked' : ''} onchange="S.supMode=this.checked;save();render()">${t('supTools')}</label>
          <div class="muted">${DATA_INFO.src === 'sample' ? `<span class="warn">${t('sampleData')}</span>`
            : `${t('dataFrom')}: ${esc(DATA_INFO.generated)} · ${EMP.length} / ${DB.styles().length} ${t('style')}`}</div>`;
}
const qBadge = s => { const q = s.quality || AN.quality(s); return `<span class="badge ${q.status}">${t('q_' + q.status)}</span>`; };
const revBadge = id => REV[id] ? `<span class="badge ${REV[id].status === 'approved' ? 'ok' : 'review'}">${t('rv_' + REV[id].status)}</span>` : '';
function viewHistory() {
  if (!H.length) return `<div class="card">${t('noHistory')}</div>`;
  const n = H.filter(h => !h.exported).length;
  return `<button onclick="exportNew()" ${n ? '' : 'disabled'}>${t('exportAll')} (${n})</button>` + H.map(h => `<div class="card item" onclick="go('detail','${h.id}','history')">
    <b>${t('line')} ${esc(h.line)}</b> &nbsp; <small>${esc(h.style)}</small> ${qBadge(h)}<br><small>${fmtDate(h.date)} · ${t('ty_' + (h.type || 'routine'))}</small>${h.exported ? ` <small class="muted">✓ ${t('exported')}</small>` : ''}
    <div>${t('cap')}: <b>${f(h.result.lineCapacity)}</b> &nbsp; ${t('eff')}: <b>${f(h.result.lineEfficiency * 100)}%</b></div></div>`).join('');
}
function reviewPanel(h) {
  const r = REV[h.id] || {};
  return `<div class="card"><h3>${t('review')} ${revBadge(h.id)}</h3>
    <textarea id="rvText" rows="2" placeholder="${t('rvComment')}">${esc(r.comment || '')}</textarea>
    <div class="row"><button class="green" onclick="saveReview('${h.id}','approved')">${t('rv_approved')}</button>
    <button class="red" onclick="saveReview('${h.id}','recheck')">${t('rv_recheck')}</button>
    <button class="sec" onclick="saveReview('${h.id}','')">${t('rv_clear')}</button></div></div>`;
}
async function saveReview(id, status) {
  if (!status) delete REV[id]; else REV[id] = { status, comment: ($('rvText') || {}).value || '', by: S.me ? S.me.name : '', at: new Date().toISOString() };
  try { await kv.set('reviews', REV); } catch (e) {}
  toast(t('rvSaved')); render();
}
function viewDetail() {
  const h = findStudy(detailId);

      <small>${fmtDate(h.date)}${h.ie ? ' · ' + esc(h.ie) : ''}${h.updated ? ' · ' + t('updated') + ' ' + fmtDate(h.updated) : ''}</small>${h.exported ? ` <small class="muted">✓ ${t('exported')}</small>` : ''}

      ${h.note ? `<div>📝 ${esc(h.note)}</div>` : ''}${own ? '' : `<div class="muted">${t('readOnly')}</div>`}</div>`
    + (q.issues.length ? qualityHtml(q) : '')
    + (own ? `<button onclick="editStudy('${h.id}')">${t('editStudy')}</button>

function balanceChart(r, tgt) {              // inline SVG: capacity per operation, bottleneck in red
  const ops = Object.keys(r.opCap).map(Number).sort((a, b) => a - b);
  if (!ops.length) return '';
  const bw = 26, gap = 10, left = 34, top = 18, bottom = 24, Ht = 180;
  const W = Math.max(320, left + ops.length * (bw + gap) + 10);
  const base = Math.max(...ops.map(o => r.opCap[o]), tgt || 0, r.lineCapacity) || 1, max = base * 1.15;
  const y = v => top + (Ht - top - bottom) * (1 - v / max);
  let g = `<svg viewBox="0 0 ${W} ${Ht}" width="${W}" height="${Ht}" role="img">`;
  [0, .5, 1].forEach(k => { const v = base * k;
    g += `<line x1="${left}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#e5e7eb"/><text x="${left - 4}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="#555">${Math.round(v)}</text>`; });
  ops.forEach((o, i) => {
    const x = left + i * (bw + gap) + gap / 2, v = r.opCap[o], bn = r.bottleneckOps.includes(o);
    g += `<rect x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(0, y(0) - y(v))}" rx="3" fill="${bn ? '#dc2626' : '#1f4e79'}"/>`
       + `<text x="${x + bw / 2}" y="${y(v) - 3}" font-size="9" text-anchor="middle" fill="#222">${Math.round(v)}</text>`
       + `<text x="${x + bw / 2}" y="${Ht - 8}" font-size="10" text-anchor="middle" fill="#222">${o}</text>`;
  });
  g += `<line x1="${left}" x2="${W}" y1="${y(r.lineCapacity)}" y2="${y(r.lineCapacity)}" stroke="#dc2626" stroke-dasharray="4 3"/>`;
  if (tgt) g += `<line x1="${left}" x2="${W}" y1="${y(tgt)}" y2="${y(tgt)}" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 3"/>`
              + `<text x="${W - 2}" y="${y(tgt) - 3}" font-size="10" text-anchor="end" fill="#16a34a">${t('lgTgt')} ${tgt}</text>`;
  g += '</svg>';
  return `<div class="card"><b>${t('chartTitle')}</b><div style="overflow-x:auto">${g}</div>
    <div class="legend"><i style="background:#1f4e79"></i>${t('lgOp')}<i style="background:#dc2626"></i>${t('lgBn')} / ${t('lgCap')}${tgt ? `<i style="background:#16a34a"></i>${t('lgTgt')}` : ''}</div></div>`;
}
function showResult(r, tgt, raw) {
  let h = `<div class="card"><div class="kpi">${t('cap')}: <b>${f(r.lineCapacity)}</b>${tgt ? ` / ${tgt}` : ''}</div>
   <div class="kpi">${t('eff')}: <b>${f(r.lineEfficiency * 100)}%</b></div>
   <div class="kpi">${t('bal')}: <b>${f(r.balanceRate * 100)}%</b></div>
   <div class="kpi">${t('bn')}: <b>${r.bottleneckOps.join(', ')}</b>${(() => { const who = r.workers.filter(w => w.ops.some(o => r.bottleneckOps.includes(o))).map(w => `${w.name || w.emp} (${f(w.sec)} s)`).join(', '); return who ? ` <span class="muted">— ${esc(who)}</span>` : ''; })()}</div>`;
  if (r.missingOps && r.missingOps.length) h += `<div class="warn">⚠ ${t('missingOps')}: ${r.missingOps.join(', ')}</div>`;
  if (r.unknownOps && r.unknownOps.length) h += `<div class="warn">${t('unknown')}: ${r.unknownOps.join(', ')}</div>`;
  h += '</div>' + balanceChart(r, tgt) + `<div class="card"><b>${t('opcap')}</b><table><tr><th>${t('opn')}</th><th>${t('cap2')}</th></tr>`;
  Object.keys(r.opCap).sort((a, b) => r.opCap[a] - r.opCap[b]).forEach(o =>
    h += `<tr class="${r.bottleneckOps.includes(Number(o)) ? 'bn' : ''}"><td>${o}</td><td>${f(r.opCap[o])}</td></tr>`);
  h += `</table></div><div class="card"><b>${t('worker')}</b><table><tr><th>${t('worker')}</th><th>${t('opn')}</th><th>${t('avg')}</th><th>${t('pcsHr')}</th><th>%</th></tr>`;
  r.workers.forEach((w, i) => {
    const rm = (raw && raw[i] && raw[i].remark) || w.remark || '';
    h += `<tr><td>${esc(w.name || w.emp)}${w.cv > 0.15 && w.n >= 3 ? ' ⚠' : ''}</td><td>${esc(w.opText)}</td><td>${f(w.sec)}</td><td>${f(w.capacity)}</td><td>${f(w.eff * 100)}</td></tr>`
       + (rm ? `<tr><td colspan="5" class="muted" style="text-align:left">📝 ${esc(rm)}</td></tr>` : '');
  });
  h += `</table></div><div class="card"><b>${t('moves')}</b>`;
  h += r.suggestion.moves.length
    ? r.suggestion.moves.map(m => `<div>${t('move')} ${esc(m.name || m.emp)} ${t('from')} ${m.from} ${t('to')} ${m.to} → ${t('now')} ${f(m.newCapacity)}</div>`).join('')
    : `<div>${t('none')}</div>`;
  return h + '</div>';
}

const allStudies = () => { const m = new Map(); [...TEAM, ...H].forEach(s => { const c = m.get(s.id); if (!c || AN.when(s) >= AN.when(c)) m.set(s.id, s); }); return [...m.values()]; };
const setOf = () => ({ eff: (Number(S.sup.eff) || 55) / 100, bal: (Number(S.sup.bal) || 70) / 100 });
const okStudy = o => o && o.format === 'timestudy-1' && o.id && o.result && o.result.opCap && Array.isArray(o.raw);
async function loadTeamFiles(files) {
  const found = []; let bad = 0;
  for (const file of files) {
    if (!/\.json$/i.test(file.name)) continue;
    try { const o = JSON.parse(await file.text()); if (okStudy(o)) found.push(o); else bad++; } catch (e) { bad++; }
  }
  const m = new Map(TEAM.map(s => [s.id, s]));
  found.forEach(s => { const c = m.get(s.id); if (!c || AN.when(s) >= AN.when(c)) m.set(s.id, s); });     // keep the newest version of every study
  TEAM = [...m.values()];
  try { await kv.set('team', TEAM); } catch (e) {}
  toast(tf('teamDone', { n: found.length, bad })); render();
}
async function pickTeamFolder() {
  if (window.showDirectoryPicker) {
    try { DIRH = await window.showDirectoryPicker({ id: 'ts-studies' }); try { await kv.set('dirHandle', DIRH); } catch (e) {} await refreshTeam(); }
    catch (e) { if (!e || e.name !== 'AbortError') toast(String(e)); }
  } else $('teamFiles').click();                                  // phones / iPad: select all the study files at once
}
async function refreshTeam() {
  if (!DIRH) return pickTeamFolder();
  try {
    let p = await DIRH.queryPermission({ mode: 'read' }); if (p !== 'granted') p = await DIRH.requestPermission({ mode: 'read' });
    if (p !== 'granted') return;
    const files = []; for await (const [name, h] of DIRH.entries()) if (h.kind === 'file' && /\.json$/i.test(name)) files.push(await h.getFile());
    await loadTeamFiles(files);
  } catch (e) { DIRH = null; toast(String(e)); }
}
function setSup(k, v) { S.sup[k] = v; save(); render(); }
function barsH(items, mark) {                 // horizontal bars, e.g. efficiency per line
  if (!items.length) return '';
  const rowH = 26, left = 56, W = 360, right = 40, top = 6, maxV = Math.max(...items.map(i => i.value), mark || 0, 0.01) * 1.1;
  const H2 = top + items.length * rowH + 16, x = v => left + (W - left - right) * v / maxV;
  let g = `<svg viewBox="0 0 ${W} ${H2}" width="100%" role="img">`;
  items.forEach((it, k) => { const y = top + k * rowH;
    g += `<text x="${left - 6}" y="${y + 16}" font-size="12" text-anchor="end" fill="#222">${esc(it.label)}</text><rect x="${left}" y="${y + 3}" width="${Math.max(1, x(it.value) - left)}" height="16" rx="3" fill="${it.color}"/><text x="${x(it.value) + 4}" y="${y + 16}" font-size="11" fill="#222">${P(it.value, 0)}</text>`; });
  if (mark) g += `<line x1="${x(mark)}" x2="${x(mark)}" y1="${top}" y2="${H2 - 14}" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 3"/><text x="${x(mark)}" y="${H2 - 3}" font-size="10" text-anchor="middle" fill="#16a34a">${P(mark, 0)}</text>`;
  return g + '</svg>';
}
function trendSvg(pts, mark) {                // efficiency over time
  if (!pts.length) return '';
  const W = Math.max(320, 50 + pts.length * 46), Ht = 160, l = 36, tp = 16, b = 26, maxV = Math.max(...pts.map(p => p.value), mark || 0, 0.01) * 1.15;
  const x = i => pts.length === 1 ? l + (W - l - 10) / 2 : l + (W - l - 16) * i / (pts.length - 1), y = v => tp + (Ht - tp - b) * (1 - v / maxV);
  let g = `<svg viewBox="0 0 ${W} ${Ht}" width="${W}" height="${Ht}" role="img">`;
  [0, .5, 1].forEach(k => { const v = maxV / 1.15 * k; g += `<line x1="${l}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#e5e7eb"/><text x="${l - 4}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="#555">${P(v, 0)}</text>`; });
  if (mark) g += `<line x1="${l}" x2="${W}" y1="${y(mark)}" y2="${y(mark)}" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 3"/>`;
  g += `<polyline fill="none" stroke="#1f4e79" stroke-width="2" points="${pts.map((p, i) => x(i) + ',' + y(p.value)).join(' ')}"/>`;
  pts.forEach((p, i) => { g += `<circle cx="${x(i)}" cy="${y(p.value)}" r="3.5" fill="#1f4e79"/><text x="${x(i)}" y="${y(p.value) - 7}" font-size="10" text-anchor="middle" fill="#222">${P(p.value, 0)}</text><text x="${x(i)}" y="${Ht - 8}" font-size="10" text-anchor="middle" fill="#555">${p.label}</text>`; });
  return g + '</svg>';
}
function reasonText(r, set) { return tf('r_' + r.k, { v: P(r.v, 0), s: P(r.k === 'bal' ? set.bal : set.eff, 0) }); }
function supModel() {                         // everything the dashboard and the Excel summary show
  const set = setOf(), f2 = S.sup, all = allStudies();
  const list = AN.filterStudies(all, { from: AN.periodFrom(f2.period), line: f2.line, ie: f2.ie, type: f2.type });
  const last = AN.latestPerLine(list).map(s => ({ s, r: AN.rag(s, set), b: AN.bottleneck(s), pot: AN.potential(s), q: s.quality || AN.quality(s) }))
    .sort((a, b) => b.r.level - a.r.level || a.s.result.lineEfficiency - b.s.result.lineEfficiency);
  return { set, all, list, last, k: AN.kpis(list, set), imp: AN.improvements(list), mach: AN.machineStats(list), rem: AN.remarkStats(list, 8), off: AN.officerStats(list, set) };
}

    + recent.map(s => `<tr class="go" onclick="go('detail','${s.id}','sup')"><td class="l">${fmtDay(s.date)}</td><td class="l"><b>${esc(s.line)}</b></td><td class="l">${esc(s.style)}</td><td class="l">${esc(s.ie)}</td><td>${P(s.result.lineEfficiency)}</td><td>${qBadge(s)}</td><td>${revBadge(s.id)}</td></tr>`).join('') + '</table></div></div>';
  h += `<button onclick="exportSummary()">${t('expSummary')}</button><button class="sec" onclick="copySummary()">${t('copySummary')}</button>`;
  return h;
}

  const lines = { name: 'Lines', title: 'Latest study per line', cols: [c('Status', 10), c('Line', 8), { h: 'Style', w: 22, t: 't' }, c('Date', 12), { h: 'IE officer', w: 16, t: 't' }, { h: 'Efficiency', w: 11, t: 'p' }, { h: 'Capacity (pcs/hr)', w: 12, t: 'n' }, { h: 'Target (pcs/hr)', w: 12, t: 'n' }, { h: 'Balance rate', w: 11, t: 'p' }, c('Bottleneck op', 14), { h: 'Bottleneck machine', w: 16, t: 't' }, { h: 'Gain by balancing', w: 12, t: 'p' }, c('Quality', 12), c('Review', 14), { h: 'Why', w: 46, t: 't' }],
    rows: last.map(x => [{ v: stName(x.r.level), st: stCls(x.r.level) }, x.s.line, x.s.style, fmtDay(x.s.date), x.s.ie, x.s.result.lineEfficiency, x.s.result.lineCapacity, Number(x.s.target) || '', x.s.result.balanceRate, x.b.ops.join(', '), x.b.machines.join(', '), x.pot,
      en('q_' + x.q.status), REV[x.s.id] ? en('rv_' + REV[x.s.id].status) : '', x.r.reasons.map(r => tfEn('r_' + r.k, { v: P(r.v, 0), s: P(r.k === 'bal' ? set.bal : set.eff, 0) })).join('; ')]) };
  const studies = { name: 'Studies', title: 'All studies in the period', cols: [c('Date', 12), c('Line', 8), { h: 'Style', w: 22, t: 't' }, { h: 'IE officer', w: 16, t: 't' }, { h: 'Type', w: 22, t: 't' }, { h: 'Operators', w: 10, t: 'i' }, { h: 'Manpower', w: 10, t: 'i' }, { h: 'Capacity (pcs/hr)', w: 12, t: 'n' }, { h: 'Target (pcs/hr)', w: 12, t: 'n' }, { h: 'Efficiency', w: 11, t: 'p' }, { h: 'Balance rate', w: 11, t: 'p' }, c('Bottleneck op', 14), { h: 'Bottleneck machine', w: 16, t: 't' }, { h: 'Gain by balancing', w: 12, t: 'p' }, c('Quality', 12), c('Review', 14), { h: 'Review comment', w: 30, t: 't' }, { h: 'Note / change made', w: 40, t: 't' }],
    rows: [...list].sort((a, b) => AN.at(b) - AN.at(a)).map(s => { const b = AN.bottleneck(s), q = s.quality || AN.quality(s), rv = REV[s.id] || {};
      return [fmtDay(s.date), s.line, s.style, s.ie, en('ty_' + (s.type || 'routine')), (s.raw || []).length, Number(s.manpower) || '', s.result.lineCapacity, Number(s.target) || '', s.result.lineEfficiency, s.result.balanceRate, b.ops.join(', '), b.machines.join(', '), AN.potential(s), en('q_' + q.status), rv.status ? en('rv_' + rv.status) : '', rv.comment || '', s.note || '']; }) };
  const imp = { name: 'Improvements', title: 'Improvement tracker (before / after)', cols: [c('Line', 8), { h: 'Style', w: 22, t: 't' }, { h: 'Efficiency before', w: 14, t: 'p' }, { h: 'Efficiency after', w: 14, t: 'p' }, { h: 'Change (points)', w: 14, t: 'n' }, { h: 'Capacity change', w: 14, t: 'p' }, { h: 'What was changed', w: 50, t: 't' }],
    rows: m.imp.map(x => [x.line, x.style, x.before.result.lineEfficiency, x.after.result.lineEfficiency, x.dEff * 100, x.dCap, x.after.note || '']) };
  const mach = { name: 'Bottlenecks', title: 'How often each machine type holds the bottleneck', cols: [{ h: 'Machine type', w: 24, t: 't' }, { h: 'Studies', w: 12, t: 'i' }], rows: m.mach.map(x => [x.machine, x.n]) };
  const rem = { name: 'Remarks', title: 'Most frequent operator remarks', cols: [{ h: 'Remark', w: 60, t: 't' }, { h: 'Times', w: 10, t: 'i' }], rows: AN.remarkStats(list, 30).map(x => [x.text, x.n]) };
  const off = { name: 'IE activity', title: 'IE officer activity and study quality', cols: [{ h: 'IE officer', w: 20, t: 't' }, { h: 'Studies', w: 10, t: 'i' }, { h: 'Quality OK', w: 12, t: 'p' }, { h: 'Need review', w: 12, t: 'i' }, { h: 'Avg cycles per operator', w: 16, t: 'n' }, { h: 'Avg variation', w: 14, t: 'p' }, c('Last study', 12)],
    rows: m.off.map(o => [o.ie, o.studies, o.okPct, o.review, o.avgCycles, o.avgCv, o.last ? fmtDay(new Date(o.last).toISOString()) : '']) };
  return [summary, lines, studies, imp, mach, rem, off];

const tfEn = (k, o) => Object.keys(o).reduce((s, x) => s.split('{' + x + '}').join(o[x]), T.en[k]);
function exportSummary() {
  let file;
  try { const d = new Date(), p = x => String(x).padStart(2, '0'); file = summaryXlsxFile(summarySpecs(), `Capacity_Summary_${S.sup.period}_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}.xlsx`); }

// =====================================================================
// EMAIL LIST + SEND (the IE officer picks the name once)
// =====================================================================
const fold = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/gi, 'd').toLowerCase();
const okMail = e => /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(e);
const roleOf = v => /sup|giam sat|\bgs\b|manager|truong|lead/.test(fold(v)) ? 'supervisor' : 'officer';
function parsePeople(txt) {                   // CSV (comma, semicolon or tab) or JSON; columns: name, email, role (optional)
  txt = String(txt).replace(/^\uFEFF/, '').trim();
  let rows;
  if (txt[0] === '{' || txt[0] === '[') {
    const j = JSON.parse(txt), arr = Array.isArray(j) ? j : (j.people || []);
    rows = arr.map(p => [p.name, p.email, p.role]);
  } else {
    const lines = txt.split(/\r?\n/).filter(l => l.trim());
    const count = (l, d) => l.split(d).length - 1;
    const d = [',', ';', '\t'].sort((a, b) => count(lines[0], b) - count(lines[0], a))[0];
    const split = l => { const o = []; let cur = '', q = false;
      for (let i = 0; i < l.length; i++) { const c = l[i];
        if (c === '"') { if (q && l[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
        else if (c === d && !q) { o.push(cur); cur = ''; } else cur += c; }
      o.push(cur); return o.map(x => x.trim()); };
    rows = lines.map(split);
    const head = rows[0].map(x => fold(x));
    if (head.some(x => x.includes('mail'))) {                                 // header row: find the columns
      const ni = Math.max(0, head.findIndex(x => x.includes('name') || x.includes('ten'))), ei = head.findIndex(x => x.includes('mail')),
            ri = head.findIndex(x => x.includes('role') || x.includes('vai tro') || x.includes('chuc'));
      rows = rows.slice(1).map(r => [r[ni], r[ei], ri >= 0 ? r[ri] : '']);
    }
  }
  return rows.map(r => ({ name: String(r[0] || '').trim(), email: String(r[1] || '').trim(), role: roleOf(r[2]) }))
    .filter(p => p.name && okMail(p.email)).sort((a, b) => a.name.localeCompare(b.name, 'vi'));
}
async function loadPeopleFile(inp) {
  const file = inp.files && inp.files[0]; if (!file) return;
  try {
    const list = parsePeople(await file.text());
    if (!list.length) { alert(t('badPeople')); inp.value = ''; return; }
    PEOPLE = list; await kv.set('people', list);
    if (S.me && !list.some(p => p.email === S.me.email)) S.me = null;
    else if (S.me) S.me.role = list.find(p => p.email === S.me.email).role;
    save(); render(); if (!S.me) openChooser();
  } catch (e) { alert(t('badPeople')); }
  inp.value = '';
}
function openChooser(cb) {
  closeChooser(); CHOOSER_CB = cb || null;
  const m = document.createElement('div'); m.id = 'modal';
  m.innerHTML = `<div class="sheet"><b>${t('whoAreYou')}</b><input id="pq" placeholder="${t('searchName')}" autocomplete="off"><div id="plist"></div><button class="sec" onclick="closeChooser()">${t('cancel')}</button></div>`;
  document.body.appendChild(m);
  const draw = () => { const qs = fold($('pq').value).split(/\s+/).filter(Boolean);          // every typed word must match
    $('plist').innerHTML = PEOPLE.map((p, i) => [p, i]).filter(([p]) => { const hay = fold(p.name + ' ' + p.email); return qs.every(w => hay.includes(w)); }).slice(0, 100)
      .map(([p, i]) => `<button class="sec pl" onclick="pickPerson(${i})">${esc(p.name)}<small>${esc(p.email)}</small></button>`).join('') || `<div class="muted">${t('noMatch')}</div>`; };
  $('pq').oninput = draw; draw();
}
function closeChooser() { const m = $('modal'); if (m) m.remove(); }
function pickPerson(i) {
  S.me = { name: PEOPLE[i].name, email: PEOPLE[i].email, role: PEOPLE[i].role || 'officer' };
  if (!S.ie.trim()) S.ie = S.me.name;                              // "Studied by" is filled in automatically
  save();
  const cb = CHOOSER_CB; CHOOSER_CB = null; closeChooser();
  if (cb) cb(); else render();
}
function toast(msg) {
  const old = $('toast'); if (old) old.remove();
  const d = document.createElement('div'); d.id = 'toast'; d.textContent = msg; document.body.appendChild(d);
  setTimeout(() => d.remove(), 9000);
}
function sendReport(id) {                     // Excel report (+ data file) -> OneDrive "reports" folder; the flow e-mails the Excel to the address in the file name
  const h = H.find(x => x.id === id); if (!h) return;
  if (!PEOPLE.length) { alert(t('noPeople')); return; }
  if (!S.me) { openChooser(() => sendReport(id)); return; }       // first time only
  let files;
  try { files = [studyXlsxFile(h, DB.ops(h.style), LOGO, S.me.email), studyFile(h)]; } catch (e) { alert(t('xlsxFail') + ' ' + e.message); return; }
  return shareFiles(files).then(ok => { if (ok) { h.exported = true; saveHist(); toast(tf('sendInfo', { email: S.me.email })); } });
}

// LOAD DATA FILE / EXPORT STUDY FILES  (no sign-in: the phone's file picker and share sheet)
// =====================================================================
async function loadDataFile(inp) {
  const file = inp.files && inp.files[0]; if (!file) return;
  try { await ingestDataText(await file.text()); } catch (e) { alert(t('badFile')); }
  inp.value = '';
}
async function ingestDataText(txt) {          // accepts data.json or data.js
  const i = txt.indexOf('{'), k = txt.lastIndexOf('}');
  const d = JSON.parse(txt.slice(i, k + 1));
  if (!Array.isArray(d.employees) || typeof d.ops !== 'object') throw new Error('bad');
  await kv.set('data', d); setData(d, 'loaded');
  S.style = DB.findStyle(S.style) || DB.styles()[0] || ''; save(); render();
}
function studyFile(h) {                       // the data file the supervisor dashboard and Access import read
  const body = { format:'timestudy-1', id:h.id, date:h.date, updated:h.updated || null, line:h.line, style:h.style, target:h.target, ie:h.ie, type:h.type || 'routine', note:h.note || '', manpower:h.manpower || '',
                 cyclesGoal:h.cyclesGoal || null, raw:h.raw, opsSnap:h.opsSnap || [], quality:h.quality || AN.quality(h), meta:h.meta, result:h.result };
  const clean = x => String(x).replace(/[^A-Za-z0-9._-]/g, '_');
  const stamp = (h.updated || h.date).slice(0, 16).replace(/[-:T]/g, '');          // a changed study gets a new file name
  const name = `study_${clean(h.line)}_${clean(h.style)}_${stamp}_${h.id.slice(0, 8)}.json`;
  return new File([JSON.stringify(body)], name, { type:'application/json' });
}
function download(file) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function shareFiles(files) {          // phone share sheet (choose OneDrive); normal download as fallback
  try {
    if (navigator.canShare && navigator.canShare({ files })) await navigator.share({ files });
    else files.forEach(download);
    return true;
  } catch (e) { if (e && e.name === 'AbortError') return false; files.forEach(download); return true; }
}
async function exportStudies(list) {
  if (!list.length) { toast(t('allSent')); return; }
  if (!(await shareFiles(list.map(studyFile)))) return;
  list.forEach(h => h.exported = true); saveHist(); render();
}
let LOGO = null;                              // optional logo.png from the app folder, loaded at start so sharing stays instant
async function loadLogo() { try { const r = await fetch('logo.png'); if (r.ok) LOGO = new Uint8Array(await r.arrayBuffer()); } catch (e) {} }

const exportOne = id => exportStudies(H.filter(h => h.id === id));

// live timer display
setInterval(() => {

$('lang').onchange = e => { S.lang = e.target.value; save(); render(); };
async function boot() {

  try { const tm = await kv.get('team'); if (Array.isArray(tm)) TEAM = tm; const rv = await kv.get('reviews'); if (rv && typeof rv === 'object') REV = rv; DIRH = (await kv.get('dirHandle')) || null; } catch (e) {}
