:root{--bg:#f1f1ef;--panel:#fff;--text:#091d36;--muted:#5f6670;--line:#e2e2e2;--accent:#0058a0;--accent-tx:#fff;--brand-red:#ed1c24;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",Roboto,Arial,sans-serif}
header{display:flex;gap:8px;align-items:center;padding:8px 16px;background:var(--panel);border-bottom:3px solid var(--accent);box-shadow:0 1px 0 var(--brand-red);position:sticky;top:0;z-index:5}
header b{flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#logo{height:28px;width:auto;flex:none}
#author{position:fixed;right:8px;bottom:4px;font-size:10px;color:var(--muted);opacity:.75;pointer-events:none;z-index:1}
header select,header button{width:auto;margin:0;padding:6px 10px}
header button{background:var(--sel);color:var(--accent);border-color:transparent;font-weight:600}
main{padding:12px 12px 24px;max-width:640px;margin:auto}main.wide{max-width:1000px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:14px;display:flex;gap:8px;align-items:center}
.num{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-tx);align-items:center;justify-content:center;font-size:12px}
input,select,button,textarea{font:inherit;font-size:15px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);width:100%;margin:4px 0;background:var(--panel);color:var(--text)}
button{background:var(--accent);color:var(--accent-tx);border-color:var(--accent);cursor:pointer;width:100%}
button:hover:not(:disabled){filter:brightness(1.08)}
button:disabled{opacity:.4;cursor:not-allowed}
button.sec{background:var(--panel);color:var(--text);border-color:var(--line)}

button.red{background:var(--bad);border-color:var(--bad);color:#fff}
button.green{background:var(--ok);border-color:var(--ok);color:var(--accent-tx)}
button.big{font-size:22px;padding:16px}
button.home{font-size:20px;padding:30px 18px;margin:10px 0}
button.small{width:auto;padding:4px 12px;font-size:13px;margin:2px}
.row{display:flex;gap:8px}.row>*{flex:1}
.time{font-size:34px;text-align:center;font-variant-numeric:tabular-nums}

td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}

.savebar{position:sticky;bottom:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:0 -2px 8px rgba(0,0,0,.12);margin-top:8px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-right:4px}

.q-ok{border-left:4px solid var(--ok)}.q-check{border-left:4px solid var(--warn)}.q-review{border-left:4px solid var(--bad)}

.scroll{overflow-x:auto}.scroll table{min-width:620px}
tr.go{cursor:pointer}tr.go:hover{background:var(--sel)}
.badge,.tag{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;white-space:nowrap;background:var(--sel);color:var(--text)}
.badge.ok,.t-ok{background:var(--okbg);color:var(--ok)}.badge.check,.t-warn{background:var(--warnbg);color:var(--warn)}.badge.review,.t-bad{background:var(--badbg);color:var(--bad)}.t-info{background:var(--infobg);color:var(--info)}

// =====================================================================
const SAMPLE_EMP = [['000001','Sample Employee 1'],['000002','Sample Employee 2'],['000003','Sample Employee 3'],['000004','Sample Employee 4']]
  .map(([code,name]) => ({ code, name, line:'G08' }));
const SAMPLE_SAM = {31:.1998,32:.3601,33:.259,34:.3661,35:.8977,36:1.5361,37:.3528,38:.705,39:.5543,40:.7047,41:.2764,42:.2412,43:.1779,44:.4709,45:.1969,46:.5363,47:.1386,48:.2716,49:.2389,50:.1808,97:.3576};
const OP_MIN = 31, OP_MAX = 116, NOPU = '—';           // only operations 31 to 116 are studied
const K = s => String(s || '').trim().toUpperCase();
const fold = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/gi, 'd').toLowerCase();
const isDummy = n => /dumm?y/.test(fold(n));          // "Dummy", "DUMMY 3", "dumy" are placeholder workers
let EMP = [], OPS = {}, LM = {}, DATA_INFO = { src:'sample', generated:'' };
const baseLine = s => { s = K(s); const m = s.match(/^[^\-_ (]+/); return m ? m[0] : s; };       // L03_B -> L03, S11 (S23) -> S11
const puOf = line => LM[K(line)] || LM[baseLine(line)] || '';
function setData(d, src) {
  EMP = (d.employees || []).filter(e => !isDummy(e.name) && !isDummy(e.code));
  OPS = d.ops || {}; LM = {};
  (d.lineMap || []).forEach(x => { if (x.line && x.pu) LM[K(x.line)] = K(x.pu); });
  DATA_INFO = { src, generated:d.generated || '' };
}
function useSample() {
  setData({ employees:SAMPLE_EMP, lineMap:[{ line:'G08', pu:'PU2' }], ops:{ 'PUM25-00054-1301H4': Object.keys(SAMPLE_SAM).map(n => ({ no:Number(n), code:'', sam:SAMPLE_SAM[n], machine:'SNLS' })) } }, 'sample');
}
// small key-value store (IndexedDB, falls back to localStorage)
const kv = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('ts-db', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const hasIDB = typeof indexedDB !== 'undefined';
  return {
    get: k => !hasIDB ? Promise.resolve(JSON.parse(localStorage.getItem('kv_' + k) || 'null'))
      : open().then(db => new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); })),
    set: (k, v) => !hasIDB ? Promise.resolve(localStorage.setItem('kv_' + k, JSON.stringify(v)))
      : open().then(db => new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }))
  };
})();
const norm = s => String(s || '').trim().toUpperCase();
const puKey = line => puOf(line) || NOPU;
const DB = {
  pus:       () => [...new Set(EMP.map(e => puKey(e.line)))].sort((a, b) => (a === NOPU) - (b === NOPU) || a.localeCompare(b)),
  lines:     pu => [...new Set(EMP.filter(e => !pu || puKey(e.line) === pu).map(e => e.line))].sort(),
  employees: line => [...EMP, ...(S.extra || [])].filter(e => norm(e.line) === norm(line)),     // SQL workers + workers added by hand
  styles:    () => Object.keys(OPS).sort(),
  findStyle: v => Object.keys(OPS).find(k => norm(k) === norm(v)) || '',
  ops:       style => (OPS[style] || []).filter(o => o.no >= OP_MIN && o.no <= OP_MAX).sort((a, b) => a.no - b.no)   // {no, code, sam, machine}
};
const mkOpMap = style => { const m = {}; DB.ops(style).forEach(o => m[o.no] = { sam:o.sam, machine:o.machine }); return m; };

const TYPES3 = ['new', 'qco', 'restudy'];

function fixSel() {                          // keep PU / line / style consistent with the data
  if (!S.pu && S.line) S.pu = puKey(S.line) !== NOPU || DB.employees(S.line).length ? puKey(S.line) : '';
  if (S.pu && !DB.pus().includes(S.pu)) S.pu = '';
  if (!S.pu && DB.pus().length === 1) S.pu = DB.pus()[0];
  if (S.line && !DB.lines(S.pu).includes(S.line)) S.line = '';
  if (!TYPES3.includes(S.type)) S.type = 'new';
}
function mergeRows(rows) {                    // several timings of one worker on the same operation are pooled for the calculation (QCO)
  const m = new Map();
  rows.forEach(r => {
    const k = r.emp + '|' + r.opText; let x = m.get(k);
    if (!x) { x = { emp:r.emp, name:r.name, opText:r.opText, pieces:[], cnt:[], skip:[], remarks:[], sessions:0, carried:true }; m.set(k, x); }
    (r.skip || []).forEach(i => x.skip.push(x.pieces.length + i));
    x.pieces.push(...r.pieces); x.cnt.push(...r.pieces.map((p, i) => (r.cnt || [])[i] || 1)); x.sessions++;
    if (r.remark) x.remarks.push(r.remark);
    if (!r.carried) x.carried = false;
  });
  return [...m.values()].map(x => ({ emp:x.emp, name:x.name, opText:x.opText, pieces:x.pieces, cnt:x.cnt, skip:x.skip, remark:[...new Set(x.remarks)].join('; '), sessions:x.sessions, carried:x.carried }));
}
const calcRows = () => mergeRows(S.rows.filter(r => r.opText && r.pieces.length));
const coveredOps = () => new Set(calcRows().flatMap(r => parseOps(r.opText)));

  const r = S.rows[i]; r.carried = false; r.pieces = []; r.cnt = []; r.laps = []; r.skip = []; r.t0 = null; r.acc = 0; r.lapAt = 0; r.ln = 1; r.goal = cyclesGoal(); save(); updateCards(); updateAnalysis();

function paintWorkers() {
  const box = $('wlist'); if (!box) return;
  const all = S.line ? DB.employees(S.line) : [];

function toggleAddW() { const b = $('addW'); b.style.display = b.style.display === 'none' ? 'block' : 'none'; if (b.style.display === 'block') $('mwName').focus(); }
function addManual() {                        // a worker that is not in the data yet (new in the line)
  const name = ($('mwName').value || '').trim();
  if (!name) { toast(t('mwNeed')); return; }
  if (!S.line) { toast(t('selLineFirst')); return; }
  let code = ($('mwCode').value || '').trim();
  const taken = c => DB.employees(S.line).some(e => same(e.code, c));
  if (!code) { let n = (S.extra || []).length + 1; do { code = 'NEW' + String(n++).padStart(3, '0'); } while (taken(code)); }
  else if (taken(code)) { toast(t('mwDup')); return; }
  (S.extra = S.extra || []).push({ code, name, line:S.line, manual:true });
  $('mwName').value = ''; $('mwCode').value = ''; $('addW').style.display = 'none';
  save(); paintWorkers(); pickWorker(code);

  S.rows = S.rows.filter(r => !same(r.emp, code)); active = S.rows.findIndex(r => r.t0 !== null);
  save(); paintWorkers(); updateCards(); updateAnalysis();

// ---------- stopwatch: Start / Stop and Lap, like a phone stopwatch ----------
// The clock keeps running while the worker sews a chain and cuts. Tap Lap when the pieces are finished (set the pieces of the lap first).
const MIN_CYCLE = 1.5;                        // seconds: a faster second Lap tap is treated as an accidental double tap
const openCard = new Set();
const cyclesGoal = () => Math.max(1, Number(S.cycles) || 5);
const goalOf = r => Math.max(1, Math.round(Number(r.goal)) || cyclesGoal());
const elapsed = (r, now) => (r.acc || 0) + (r.t0 === null ? 0 : (now === undefined ? performance.now() : now) - r.t0);
const fmtT = ms => { const x = Math.max(0, ms) / 1000, m = Math.floor(x / 60); return String(m).padStart(2, '0') + ':' + (x - m * 60).toFixed(1).padStart(4, '0'); };
function syncLaps(r) { r.pieces = r.laps.map(l => l.sec / l.n); r.cnt = r.laps.map(l => l.n); }
function normRow(r) {                         // makes sure an entry has the stopwatch fields (also for entries saved by older versions)
  r.t0 = null; r.skip = r.skip || []; r.pieces = r.pieces || []; r.sel = r.sel || [];
  if (!r.cnt || r.cnt.length !== r.pieces.length) r.cnt = r.pieces.map((p, i) => (r.cnt || [])[i] || 1);
  if (!r.laps || r.laps.length !== r.pieces.length) r.laps = r.pieces.map((p, i) => ({ sec: p * r.cnt[i], n: r.cnt[i] }));
  if (r.acc == null) r.acc = r.laps.reduce((a, l) => a + l.sec * 1000, 0);
  if (r.lapAt == null) r.lapAt = r.acc;
  r.ln = r.ln || (r.laps.length ? r.laps[r.laps.length - 1].n : 1);
  r.goal = r.goal || Math.max(Number(S.cycles) || 5, r.laps.reduce((a, l) => a + l.n, 0));
  return r;
}
function nextToTime(i) {                      // next entry that still needs pieces
  for (let k = 1; k <= S.rows.length; k++) { const j = (i + k) % S.rows.length, x = S.rows[j]; if (x.opText && !x.carried && piecesUsed(x) < goalOf(x)) return j; }
  return -1;
}
function pauseRow(r, now) { if (r.t0 !== null) { r.acc += now - r.t0; r.t0 = null; } }
function startStop(i, ev) {                   // Start / Resume / Stop (pause); only one stopwatch runs at a time
  const r = S.rows[i], now = ev ? ev.timeStamp : performance.now();
  if (r.t0 === null) { S.rows.forEach((x, k) => { if (k !== i) pauseRow(x, now); }); r.t0 = now; active = i; }
  else { pauseRow(r, now); active = S.rows.findIndex(x => x.t0 !== null); }
  save(); updateCards();
}
function lap(i, ev) {                         // one lap = the pieces set in "Pieces in this lap", measured from the previous lap
  const r = S.rows[i], now = ev ? ev.timeStamp : performance.now();
  if (r.t0 === null) return;

  if (ms < MIN_CYCLE * 1000) return;

  let next = -1;
  if (piecesUsed(r) >= goalOf(r)) { pauseRow(r, now); active = S.rows.findIndex(x => x.t0 !== null); openCard.delete(i); next = nextToTime(i); }   // target reached: stop and move on
  save(); updateCards(); updateAnalysis();
  if (next >= 0) { const el2 = $('card' + next); if (el2 && el2.scrollIntoView) el2.scrollIntoView({ behavior:'smooth', block:'center' }); }
}
function resetLap(i) { const r = S.rows[i]; if (r.t0 !== null) return; r.acc = r.lapAt; save(); updateCards(); }       // throw away the unfinished part of the current lap
function undoLap(i) {                         // remove the last lap; its time goes back into the lap that is running
  const r = S.rows[i], l = r.laps.pop(); if (!l) return;
  r.lapAt = Math.max(0, r.lapAt - l.sec * 1000); r.skip = r.skip.filter(k => k < r.laps.length); syncLaps(r);
  save(); updateCards(); updateAnalysis();
}
function lnAdj(i, d) { const r = S.rows[i]; r.ln = Math.max(1, (r.ln || 1) + d); const el = $('ln' + i); if (el) el.textContent = r.ln; save(); }
function setLapN(i, k, d) { const r = S.rows[i]; r.laps[k].n = Math.max(1, r.laps[k].n + d); syncLaps(r); save(); updateCards(); updateAnalysis(); }
function toggleCycle(i, k) {                  // exclude / include an abnormal lap
  const r = S.rows[i];
  r.skip = r.skip.includes(k) ? r.skip.filter(x => x !== k) : [...r.skip, k];
  save(); updateCards(); updateAnalysis();
}
function setGoal(i, v) { const r = S.rows[i]; r.goal = Math.max(1, Math.round(Number(v)) || 1); save(); updateCards(); }
function del(i) { S.rows.splice(i, 1); active = S.rows.findIndex(r => r.t0 !== null); openCard.clear(); save(); updateCards(); updateAnalysis(); }

}

function balanceChart(r, tgt) {              // inline SVG: capacity per operation, bottleneck in red
  const ops = Object.keys(r.opCap).map(Number).sort((a, b) => a - b);
  if (!ops.length) return '';
  const bw = 26, gap = 10, left = 34, top = 18, bottom = 24, Ht = 180;
  const W = Math.max(320, left + ops.length * (bw + gap) + 10);
  const base = Math.max(...ops.map(o => r.opCap[o]), tgt || 0, r.lineCapacity) || 1, max = base * 1.15;
  const y = v => top + (Ht - top - bottom) * (1 - v / max);
  let g = `<svg viewBox="0 0 ${W} ${Ht}" width="${W}" height="${Ht}" role="img">`;
  [0, .5, 1].forEach(k => { const v = base * k;
    g += `<line class="ll" x1="${left}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="sm" x="${left - 4}" y="${y(v) + 4}" font-size="10" text-anchor="end">${Math.round(v)}</text>`; });
  ops.forEach((o, i) => {
    const x = left + i * (bw + gap) + gap / 2, v = r.opCap[o], bn = r.bottleneckOps.includes(o);
    g += `<rect class="${bn ? 'sb' : 'sa'}" x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(0, y(0) - y(v))}" rx="3"/>`
       + `<text class="st" x="${x + bw / 2}" y="${y(v) - 3}" font-size="9" text-anchor="middle">${Math.round(v)}</text>`
       + `<text class="st" x="${x + bw / 2}" y="${Ht - 8}" font-size="10" text-anchor="middle">${o}</text>`;
  });
  g += `<line class="lb" x1="${left}" x2="${W}" y1="${y(r.lineCapacity)}" y2="${y(r.lineCapacity)}" stroke-dasharray="4 3"/>`;
  if (tgt) g += `<line class="lk" x1="${left}" x2="${W}" y1="${y(tgt)}" y2="${y(tgt)}" stroke-width="2" stroke-dasharray="6 3"/>`
              + `<text class="sk" x="${W - 2}" y="${y(tgt) - 3}" font-size="10" text-anchor="end">${t('lgTgt')} ${tgt}</text>`;
  g += '</svg>';
  return `<div class="card"><b>${t('chartTitle')}</b><div style="overflow-x:auto">${g}</div>
    <div class="legend"><i style="background:var(--accent)"></i>${t('lgOp')}<i style="background:var(--bad)"></i>${t('lgBn')} / ${t('lgCap')}${tgt ? `<i style="background:var(--ok)"></i>${t('lgTgt')}` : ''}</div></div>`;
}
function showResult(r, tgt, raw) {
  let h = `<div class="card"><div class="kpi">${t('cap')}: <b>${f(r.lineCapacity)}</b>${tgt ? ` / ${tgt}` : ''}</div>
   <div class="kpi">${t('eff')}: <b>${f(r.lineEfficiency * 100)}%</b></div>
   <div class="kpi">${t('bal')}: <b>${f(r.balanceRate * 100)}%</b></div>
   <div class="kpi">${t('bn')}: <b>${r.bottleneckOps.join(', ')}</b>${(() => { const who = r.workers.filter(w => w.ops.some(o => r.bottleneckOps.includes(o))).map(w => `${w.name || w.emp} (${f(w.sec)} s)`).join(', '); return who ? ` <span class="muted">— ${esc(who)}</span>` : ''; })()}</div>`;

    : `<div>${t('none')}</div>`;
  return h + '</div>';
}

function summarySpecs() {                     // sheets of the supervisor's Excel summary

  const lines = { name: 'Lines', title: 'Latest study per line', cols: [c('Status', 10), c('PU', 8), c('Line', 8), { h: 'Style', w: 22, t: 't' }, c('Date', 12), { h: 'IE officer', w: 16, t: 't' }, { h: 'Efficiency', w: 11, t: 'p' }, { h: 'Capacity (pcs/hr)', w: 12, t: 'n' }, { h: 'Target (pcs/hr)', w: 12, t: 'n' }, { h: 'Balance rate', w: 11, t: 'p' }, c('Bottleneck op', 14), { h: 'Bottleneck machine', w: 16, t: 't' }, { h: 'Gain by balancing', w: 12, t: 'p' }, c('Quality', 12), c('Review', 14), { h: 'Why', w: 46, t: 't' }],
    rows: last.map(x => [{ v: stName(x.r.level), st: stCls(x.r.level) }, studyPU(x.s), x.s.line, x.s.style, fmtDay(x.s.date), x.s.ie, x.s.result.lineEfficiency, x.s.result.lineCapacity, Number(x.s.target) || '', x.s.result.balanceRate, x.b.ops.join(', '), x.b.machines.join(', '), x.pot,
      en('q_' + x.q.status), REV[x.s.id] ? en('rv_' + REV[x.s.id].status) : '', x.r.reasons.map(r => tfEn('r_' + r.k, { v: P(r.v, 0), s: P(r.k === 'bal' ? set.bal : set.eff, 0) })).join('; ')]) };
  const studies = { name: 'Studies', title: 'All studies in the period', cols: [c('Date', 12), c('PU', 8), c('Line', 8), { h: 'Style', w: 22, t: 't' }, { h: 'IE officer', w: 16, t: 't' }, { h: 'Type', w: 22, t: 't' }, { h: 'Operators', w: 10, t: 'i' }, { h: 'Manpower', w: 10, t: 'i' }, { h: 'Capacity (pcs/hr)', w: 12, t: 'n' }, { h: 'Target (pcs/hr)', w: 12, t: 'n' }, { h: 'Efficiency', w: 11, t: 'p' }, { h: 'Balance rate', w: 11, t: 'p' }, c('Bottleneck op', 14), { h: 'Bottleneck machine', w: 16, t: 't' }, { h: 'Gain by balancing', w: 12, t: 'p' }, c('Quality', 12), c('Review', 14), { h: 'Review comment', w: 30, t: 't' }, { h: 'Note / change made', w: 40, t: 't' }],
    rows: [...list].sort((a, b) => AN.at(b) - AN.at(a)).map(s => { const b = AN.bottleneck(s), q = s.quality || AN.quality(s), rv = REV[s.id] || {};
      return [fmtDay(s.date), studyPU(s), s.line, s.style, s.ie, T.en['ty_' + (s.type || 'new')], (s.raw || []).length, Number(s.manpower) || '', s.result.lineCapacity, Number(s.target) || '', s.result.lineEfficiency, s.result.balanceRate, b.ops.join(', '), b.machines.join(', '), AN.potential(s), en('q_' + q.status), rv.status ? en('rv_' + rv.status) : '', rv.comment || '', s.note || '']; }) };
  const imp = { name: 'Improvements', title: 'Re-study results (previous / new)', cols: [c('Line', 8), { h: 'Style', w: 22, t: 't' }, { h: 'Efficiency previous', w: 14, t: 'p' }, { h: 'Efficiency re-study', w: 14, t: 'p' }, { h: 'Change (points)', w: 14, t: 'n' }, { h: 'Capacity change', w: 14, t: 'p' }, { h: 'What was changed', w: 50, t: 't' }],
    rows: m.imp.map(x => [x.line, x.style, x.before.result.lineEfficiency, x.after.result.lineEfficiency, x.dEff * 100, x.dCap, x.after.note || '']) };
  const mach = { name: 'Bottlenecks', title: 'How often each machine type holds the bottleneck', cols: [{ h: 'Machine type', w: 24, t: 't' }, { h: 'Studies', w: 12, t: 'i' }], rows: m.mach.map(x => [x.machine, x.n]) };

  const off = { name: 'IE activity', title: 'IE officer activity and study quality', cols: [{ h: 'IE officer', w: 20, t: 't' }, { h: 'Studies', w: 10, t: 'i' }, { h: 'Quality OK', w: 12, t: 'p' }, { h: 'Need review', w: 12, t: 'i' }, { h: 'Avg cycles per operator', w: 16, t: 'n' }, { h: 'Avg variation', w: 14, t: 'p' }, c('Last study', 12)],
    rows: m.off.map(o => [o.ie, o.studies, o.okPct, o.review, o.avgCycles, o.avgCv, o.last ? fmtDay(new Date(o.last).toISOString()) : '']) };
  return [summary, lines, studies, imp, mach, rem, off];

const tfEn = (k, o) => Object.keys(o).reduce((s, x) => s.split('{' + x + '}').join(o[x]), T.en[k]);
function exportSummary() {
  let file;
  try { const d = new Date(), p = x => String(x).padStart(2, '0'); file = summaryXlsxFile(summarySpecs(), `Capacity_Summary_${S.sup.period}_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}.xlsx`); }
  catch (e) { alert(t('xlsxFail') + ' ' + e.message); return; }

// =====================================================================
// SERVER: login, sync, e-mail the report  (Google Sheet + Apps Script)
// =====================================================================
async function api(action, body, ms) {
  if (!API_URL) throw new Error(t('notConfigured'));
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), ms || 60000);
  try {
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ctl.signal,
      body: JSON.stringify({ action, email: S.me ? S.me.email : '', pin: S.pin || '', ...(body || {}) }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Server error');
    return j;
  } finally { clearTimeout(timer); }
}
function closeModal() { const m = $('modal'); if (m) m.remove(); }
function openLogin(msg) {
  closeModal();
  const m = document.createElement('div'); m.id = 'modal';
  m.innerHTML = `<div class="sheet"><b>${t('login')}</b><div class="muted">${t('loginHelp')}</div>
    <input id="lgEmail" type="email" placeholder="${t('email')}" autocomplete="username" value="${esc(S.me ? S.me.email : '')}">
    <input id="lgPin" type="password" inputmode="numeric" placeholder="${t('pin')}" autocomplete="current-password">
    <div class="warn" id="lgErr">${esc(msg || '')}</div>
    <button onclick="doLogin()">${t('login')}</button>${S.me && S.pin ? `<button class="sec" onclick="closeModal()">${t('cancel')}</button>` : ''}</div>`;
  document.body.appendChild(m);
}
async function doLogin() {
  const email = $('lgEmail').value.trim().toLowerCase(), pin = $('lgPin').value.trim(), keep = { me: S.me, pin: S.pin };
  $('lgErr').textContent = ''; S.me = { email }; S.pin = pin;
  try {
    const r = await api('login'); S.me = r.user;
    if (!S.ie.trim()) S.ie = S.me.name;
    save(); closeModal(); render(); syncAll(true);
  } catch (e) { S.me = keep.me; S.pin = keep.pin; $('lgErr').textContent = t('loginFail') + ' ' + e.message; }
}
function logout() { if (!confirm(t('sure'))) return; S.me = null; S.pin = ''; save(); render(); openLogin(); }
function toast(msg) {
  const old = $('toast'); if (old) old.remove();
  const d = document.createElement('div'); d.id = 'toast'; d.textContent = msg; document.body.appendChild(d);
  setTimeout(() => d.remove(), 9000);
}
const b64 = u8 => { let x = ''; for (let i = 0; i < u8.length; i += 0x8000) x += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(x); };
function studyBody(h) {                       // what is stored on the server (slimmed: the cycle lists are already in "raw")
  const res = { ...h.result, workers: (h.result.workers || []).map(({ pieces, skip, t0, ...w }) => w) };
  return { format:'timestudy-1', id:h.id, date:h.date, updated:h.updated || null, line:h.line, style:h.style, target:h.target, ie:h.ie, type:h.type || 'new', pu:h.pu || '', baseId:h.baseId || '',
           note:h.note || '', manpower:h.manpower || '', cyclesGoal:h.cyclesGoal || null, raw:h.raw, opsSnap:h.opsSnap || [], quality:h.quality || AN.quality(h), meta:h.meta, result:res };
}
async function pushPending() {                // send every study that is not on the server yet (runs after Save, after Email, and on manual Sync now)
  if (!S.me || !API_URL || !navigator.onLine) return 0;
  let n = 0;
  for (const h of H.filter(x => !x.sent)) {
    try { await api('save', { study: studyBody(h) }); h.sent = true; delete h.syncErr; n++; saveHist(); }
    catch (e) { h.syncErr = e.message; saveHist(); throw e; }
  }
  return n;
}
async function syncMaster() {                 // employees, styles and SAM from the server; only downloads when they changed
  if (!S.me || !API_URL) return;
  const r = await api('master', { have: DATA_INFO.generated || '' }, 120000);
  if (r.data) { await kv.set('data', r.data); setData(r.data, 'server'); S.style = DB.findStyle(S.style) || DB.styles()[0] || ''; fixSel(); save(); }
}
async function syncAll(manual) {
  if (SYNCING || !API_URL || !S.me) return;
  if (!navigator.onLine) { if (manual) toast(t('offline')); return; }
  SYNCING = true;
  try { await syncMaster(); await pushPending(); await pullTeam(); if (manual) toast(t('syncOk')); }
  catch (e) {
    if (/Wrong email or PIN/.test(e.message)) { S.pin = ''; save(); openLogin(e.message); }
    else if (manual) toast(e.message);
  } finally { SYNCING = false; if (['home', 'history', 'sup'].includes(screen)) render(); }
}
async function emailReport(id) {              // one tap: save the study on the server and e-mail the Excel report to the logged-in user
  const h = H.find(x => x.id === id); if (!h) return;
  if (!S.me || !S.pin) { openLogin(); return; }
  if (!navigator.onLine) { toast(t('offline')); return; }
  toast(t('updating'));
  try {
    const r = await api('save', { study: studyBody(h), emailReport: true, xlsx: { name: studyXlsxName(h), base64: b64(studyXlsxBytes(h, DB.ops(h.style), LOGO)) } }, 120000);
    h.sent = true; saveHist();
    toast(r.emailed ? tf('emailSent', { email: r.to }) : t('emailFail') + ' ' + r.emailError);
  } catch (e) { toast(t('emailFail') + ' ' + e.message); }
  render();
}

// =====================================================================
// LOAD DATA FILE / EXPORT STUDY FILES  (no sign-in: the phone's file picker and share sheet)
// =====================================================================
async function loadDataFile(inp) {
  const file = inp.files && inp.files[0]; if (!file) return;
  try { await ingestDataText(await file.text()); } catch (e) { alert(t('badFile')); }
  inp.value = '';
}
async function ingestDataText(txt) {          // accepts data.json or data.js
  const i = txt.indexOf('{'), k = txt.lastIndexOf('}');
  const d = JSON.parse(txt.slice(i, k + 1));
  if (!Array.isArray(d.employees) || typeof d.ops !== 'object') throw new Error('bad');
  await kv.set('data', d); setData(d, 'loaded');
  S.style = DB.findStyle(S.style) || DB.styles()[0] || ''; fixSel(); save(); render();
}
function download(file) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const asText = f => new File([f], f.name + '.txt', { type:'text/plain' });   // Chrome on Android only shares text, pdf, image, audio and video files
async function shareFiles(files) {          // returns 'ok' (shared), 'cancel' (user closed the menu) or 'download' (share menu not available)
  const can = l => { try { return !!(navigator.canShare && navigator.canShare({ files: l })); } catch (e) { return false; } };
  const attempt = async l => { try { await navigator.share({ files: l }); return 'ok'; } catch (e) { return e && e.name === 'AbortError' ? 'cancel' : 'fail'; } };
  for (const list of [files, files.map(asText)]) {
    if (!can(list)) continue;
    const r = await attempt(list);
    if (r === 'ok' || r === 'cancel') return r;
  }
  toast(t('noShare')); files.forEach(download); return 'download';
}
let LOGO = null;                              // optional logo.png from the app folder, loaded at start so sharing stays instant
async function loadLogo() { try { const r = await fetch('logo.png'); if (r.ok) LOGO = new Uint8Array(await r.arrayBuffer()); } catch (e) {} }
function exportExcel(id) {                    // Excel report in the company template layout + analysis sheet
  const h = findStudy(id); if (!h) return;
  let file;
  try { file = studyXlsxFile(h, DB.ops(h.style), LOGO); } catch (e) { alert(t('xlsxFail') + ' ' + e.message); return; }
  return shareFiles([file]);
}

// live timer display (lap time and total time of the running stopwatch)
setInterval(() => {
  if (document.hidden || screen !== 'new' || active < 0 || !S.rows[active] || S.rows[active].t0 === null) return;
  const r = S.rows[active], el = elapsed(r), a = $('tm' + active), b = $('tt' + active);
  if (a) a.textContent = fmtT(el - r.lapAt);
  if (b) b.textContent = fmtT(el);
}, 100);
$('lang').onchange = e => { S.lang = e.target.value; save(); render(); };
async function boot() {
  if (typeof SYNC !== 'undefined') setData(SYNC, 'file'); else useSample();     // data.js (PC testing) or sample
  try { const d = await kv.get('data'); if (d && (!DATA_INFO.generated || (d.generated || '') >= DATA_INFO.generated)) setData(d, 'loaded'); } catch (e) {}
  try { const tm = await kv.get('team'); if (Array.isArray(tm)) TEAM = tm; const rv = await kv.get('reviews'); if (rv && typeof rv === 'object') REV = rv; } catch (e) {}
  if (!S.editId) S.style = DB.findStyle(S.style) || DB.styles()[0] || '';
  fixSel();
  if (!S.ie && S.me) S.ie = S.me.name;
  render();
  loadLogo();
  if (API_URL && (!S.me || !S.pin)) openLogin();   // sync happens on login, Save, Email, and Sync now - never automatically on open/reconnect
}
boot();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
